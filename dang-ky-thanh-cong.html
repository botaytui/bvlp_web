<body class="booking-success-page">

    <img src="./assets/images/logo.png" alt="" width="56" height="56">

  </header>
  <main class="success-main">
    <section class="success-card" aria-labelledby="success-title">

      <h1 id="success-title">Đăng ký thành công!</h1>

      <div class="success-actions">
        <a class="success-button success-button-primary" id="register-again" href="./dat-lich.html">Đăng ký tiếp</a>
